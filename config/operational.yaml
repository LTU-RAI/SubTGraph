# ****************************************************************************************************************
# Spatial description of the environment

generation_seed: 11

generation_save_folder: 'data'
generation_load_folder: 'data/subtgraph_2025-07-28_14-31-05'
generation_load_matrix: False

generation_n_worlds: 1
generation_level_control: True

generation_topology: 'linear'
generation_route_harmonic: -1

world_max_width:  [80, 100]
world_min_length: [2000, 4000]

world_n_levels: [3, 3]                          
world_n_loops_per_level: [0, 0]                 
world_n_tjunctions_per_level: [0, 2]           
world_n_intersections_per_level: [0, 2]         


# ****************************************************************************************************************
# Textures

texture_cave_wall: 'CaveWall_Operational.png'
texture_rock_pile: ''
texture_striated_rock: ''


# ****************************************************************************************************************
# Node names and descriptions

env_asset_list: 
  node: 
    parameters: 'node'
    assets: [
      "cave_corner_01_type_b",
      # "cave_corner_02_type_b",
    ]

  corner:       
    parameters: 'corner,e,s'
    assets: [
      "cave_corner_01_type_b",
      # "cave_corner_02_type_b",
    ]

  straight:     
    parameters: 'straight,e,w'
    assets: [
      "cave_straight_01_type_b",
      # "cave_straight_02_type_b",
      # "cave_straight_03_type_b",
      "cave_straight_04_type_b",
      # "cave_straight_05_type_b",
    ]

  shaft: 
    parameters: 'shaft,e,n,s,w'
    assets: [
      # "cave_vertical_shaft_type_b",
      "cave_elevation_type_b"
    ]

  junction:     
    parameters: 'junction,e,n,s'
    assets: [
      "cave_3_way_01_type_b"
    ]

  intersection: 
    parameters: 'intersection,e,n,s,w'
    assets: [
      "cave_4_way_01_type_b",
    ]