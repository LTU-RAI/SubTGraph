# ****************************************************************************************************************
# Spatial description of the environment

generation_seed: 11

generation_save_folder: 'data'
generation_load_folder: 'data/subtgraph_2026-11-16_00-51-36'
generation_load_matrix: False

generation_n_worlds: 1
generation_level_control: True

generation_topology: 'sine'
generation_route_harmonic: -1

world_max_width:  [40, 50]
world_min_length: [3000, 5000]

world_n_levels: [2, 2]                          
world_n_loops_per_level: [0, 0]                   
world_n_tjunctions_per_level: [1, 3]           
world_n_intersections_per_level: [0, 1]         


# ****************************************************************************************************************
# Textures

texture_cave_wall: 'CaveWall_LavaTube.png'
texture_rock_pile: 'RockPile_LavaTube.png'
texture_striated_rock: 'CaveWall_LavaTube.png'


# ****************************************************************************************************************
# Node names and descriptions

env_asset_list:
  node: 
    parameters: 'node'
    assets: [
      # "cave_corner_01_type_b",
      "cave_corner_02_type_b",
    ]

  corner:       
    parameters: 'corner,e,s'
    assets: [
      # "cave_corner_01_type_b",
      "cave_corner_02_type_b",
    ]

  straight:     
    parameters: 'straight,e,w'
    assets: [
      # "cave_straight_01_type_b",
      "cave_straight_02_type_b",
      "cave_straight_03_type_b",
      # "cave_straight_04_type_b",
      "cave_straight_05_type_b",
    ]

  shaft: 
    parameters: 'shaft,e,n,s,w'
    assets: [
      "cave_vertical_shaft_type_b",
      "cave_elevation_type_b"
    ]

  junction:     
